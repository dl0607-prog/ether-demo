<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ETHER DEMO</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111827;
      color: #f9fafb;
      font-family: system-ui, sans-serif;
    }

    h1 {
      background: linear-gradient(90deg, #60a5fa, #c084fc);
      background-clip: text;
      color: transparent;
    }

    #result {
      font-size: 48px;
    }
  </style>
</head>
<body>
  <h1>ETHER DEMO</h1>
  <span id="result"></span>
  <script>
    document.querySelector('#result').textContent = 2 + 3;
  </script>
</body>
</html>
