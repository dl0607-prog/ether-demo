<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ETHER Field Notes · 项目便签</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar"><a class="brand" href="/" aria-label="ETHER Field Notes 首页"><span class="mark">E</span><span>ETHER <b>FIELD NOTES</b></span></a><span class="top-note">项目想法，随手留存。</span></header>
    <main>
      <section class="intro"><div><p class="eyebrow">YOUR PROJECT DESK / 01</p><h1>把想法，<em>记在此刻。</em></h1><p class="lead">灵感、决定与下一步，放在同一处。写下之后，随时回来继续。</p></div><div class="intro-art" aria-hidden="true"><span>FIELD<br>NOTES</span><i>✳</i></div></section>
      <div class="workspace">
        <section class="notes-panel" aria-labelledby="notes-title"><div class="section-heading"><div><p class="eyebrow">COLLECTION</p><h2 id="notes-title">全部便签 <span id="count">0</span></h2></div><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索标题或内容" aria-label="搜索便签"></label></div><div id="list" class="note-list" aria-live="polite"></div></section>
        <aside class="editor-panel" aria-labelledby="editor-title"><p class="eyebrow">CAPTURE A THOUGHT</p><h2 id="editor-title">新建便签</h2><p class="editor-hint">给正在进行的项目留下一条线索。</p><form id="form"><label for="title">标题</label><input id="title" name="title" maxlength="120" required placeholder="例如：下周要验证的想法"><label for="content">内容</label><textarea id="content" name="content" maxlength="10000" required placeholder="写下细节、下一步，或任何不想忘记的事……"></textarea><div class="form-actions"><button id="cancel" class="quiet" type="button" hidden>取消编辑</button><button id="submit" class="primary" type="submit">保存便签 <span aria-hidden="true">↗</span></button></div><p id="feedback" class="feedback" role="status"></p></form><div class="editor-foot">ETHER / KEEP THE THOUGHT</div></aside>
      </div>
    </main>
    <footer><span>ETHER FIELD NOTES</span><span>让每个想法都有落点。</span></footer>
  </div>
</body>
</html>
